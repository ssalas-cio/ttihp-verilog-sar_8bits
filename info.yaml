# Tiny Tapeout project information
project:
  title:        "sar_8bits"      # Project title
  author:       "Silvestre"      # Your name
  discord:      "ssalas"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "sar 8bits"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "sar_logic.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "clk"
  ui[1]: "reset"
  ui[2]: "start_conversion"
  ui[3]: "comparator_out"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "digital_out [0]"
  uo[1]: "digital_out [1]"
  uo[2]: "digital_out [2]"
  uo[3]: "digital_out [3]"
  uo[4]: "digital_out [4]"
  uo[5]: "digital_out [5]"
  uo[6]: "digital_out [6]"
  uo[7]: "digital_out [7]"

  # Bidirectional pins
  uio[0]: "conversion_done"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
